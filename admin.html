<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>STARLIFE Admin</title><style>body{font-family:Arial;background:#f5f5f5;padding:12px}.card{background:#fff;padding:15px;margin:10px 0;border-radius:12px}button{padding:10px 14px;margin:5px;border:0;border-radius:8px;font-weight:bold;color:#fff}.ok{background:#22c55e}.no{background:#ef4444}.ref{background:#3b82f6;width:100%;padding:12px}</style></head><body><h2>STARLIFE <span id="c">Loading...</span></h2><button class="ref" onclick="load()">🔄 Refresh</button><div id="list"></div><script>const API="https://starlife-mpesa-backend.vercel.app";async function load(){let r=await fetch(API+"/api/payments");let d=await r.json();let p=d.pending||[];document.getElementById('c').innerText=p.length+" Pending";if(!p.length){document.getElementById('list').innerHTML="<p style=text-align:center>✅ No pending yet.</p>";return;}document.getElementById('list').innerHTML=p.map((u,i)=>`<div class=card><b>${u.name}</b><br>📱 ${u.phone}<br>Code: ${u.code}<br><small>${u.time}</small><br><br><button class=ok onclick="doAct('approve',${i})">✅ APPROVE</button><button class=no onclick="doAct('reject',${i})">❌ REJECT</button></div>`).join('');}async function doAct(t,i){await fetch(API+"/api/"+t,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({index:i})});alert(t+" done");load();}load();</script></body></html>
